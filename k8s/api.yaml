apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-api
  namespace: mlops-workshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-api
  template:
    metadata:
      labels:
        app: recommendation-api
    spec:
      containers:
        - name: api
          image: recommendation-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-api
  namespace: mlops-workshop
spec:
  selector:
    app: recommendation-api
  ports:
    - port: 8000
      targetPort: 8000
